<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پنل مربی</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="topbar">

            <div>
                <h1>پنل مربی</h1>
                <p>مدیریت شاگردها و برنامه‌های تمرینی</p>
            </div>

        </header>


        <main class="content">

            <!-- Dashboard -->
            <section class="dashboard">

                <div class="stats">

                    <div class="stat-card">
                        <span class="stat-number" id="clientCount">0</span>
                        <span class="stat-label">شاگرد</span>
                    </div>

                    <div class="stat-card">
                        <span class="stat-number" id="programCount">0</span>
                        <span class="stat-label">برنامه</span>
                    </div>

                    <div class="stat-card">
                        <span class="stat-number">0</span>
                        <span class="stat-label">حرکت</span>
                    </div>

                </div>


                <h2>دسترسی سریع</h2>

                <div class="quick-actions">

                    <button
                        class="action-card"
                        id="addClientButton"
                    >
                        + افزودن شاگرد
                    </button>

                    <button class="action-card">
                        + ساخت برنامه
                    </button>

                    <button class="action-card">
                        + افزودن حرکت
                    </button>

                </div>


                <h2>آخرین شاگردها</h2>

                <div id="clientList">

                    <div class="empty-box">
                        هنوز شاگردی ثبت نشده است.
                    </div>

                </div>

            </section>


            <!-- Client Profile -->
            <section
                class="client-profile"
                id="clientProfile"
            >

                <button
                    id="backButton"
                    class="back-button"
                >
                    → برگشت
                </button>


                <h2 id="profileName">
                    نام شاگرد
                </h2>


                <div class="profile-card">

                    <p>
                        <strong>شماره تماس:</strong>
                        <span id="profilePhone">-</span>
                    </p>

                    <p>
                        <strong>سن:</strong>
                        <span id="profileAge">-</span>
                    </p>

                    <p>
                        <strong>وزن:</strong>
                        <span id="profileWeight">-</span>
                    </p>

                    <p>
                        <strong>هدف:</strong>
                        <span id="profileGoal">-</span>
                    </p>

                </div>


                <!-- Programs -->
                <div class="profile-section-header">

                    <h2>برنامه‌های تمرینی</h2>

                    <button
                        id="addProgramButton"
                        class="small-button"
                    >
                        + برنامه جدید
                    </button>

                </div>


                <div id="programList">

                    <div class="empty-box">
                        هنوز برنامه‌ای برای این شاگرد ثبت نشده است.
                    </div>

                </div>

            </section>

        </main>


        <nav class="bottom-nav">

            <button class="nav-button active">
                خانه
            </button>

            <button class="nav-button">
                شاگردها
            </button>

            <button class="nav-button">
                حرکات
            </button>

            <button class="nav-button">
                تنظیمات
            </button>

        </nav>

    </div>


    <!-- Add Client Modal -->
    <div
        class="modal"
        id="clientModal"
    >

        <div class="modal-box">

            <h2>افزودن شاگرد</h2>


            <label for="clientName">
                نام و نام خانوادگی
            </label>

            <input
                type="text"
                id="clientName"
            >


            <label for="clientPhone">
                شماره تماس
            </label>

            <input
                type="text"
                id="clientPhone"
            >


            <label for="clientAge">
                سن
            </label>

            <input
                type="number"
                id="clientAge"
            >


            <label for="clientWeight">
                وزن
            </label>

            <input
                type="text"
                id="clientWeight"
                placeholder="مثلاً 82 kg"
            >


            <label for="clientGoal">
                هدف
            </label>

            <input
                type="text"
                id="clientGoal"
                placeholder="مثلاً افزایش حجم"
            >


            <div class="form-buttons">

                <button id="saveClientButton">
                    ذخیره
                </button>

                <button
                    id="cancelClientButton"
                    class="cancel-button"
                >
                    لغو
                </button>

            </div>

        </div>

    </div>


    <!-- Add Program Modal -->
    <div
        class="modal"
        id="programModal"
    >

        <div class="modal-box">

            <h2>برنامه جدید</h2>


            <label for="programTitle">
                عنوان برنامه
            </label>

            <input
                type="text"
                id="programTitle"
                placeholder="مثلاً برنامه مهر"
            >


            <label for="programGoal">
                هدف برنامه
            </label>

            <input
                type="text"
                id="programGoal"
                placeholder="مثلاً افزایش حجم"
            >


            <label for="programNotes">
                توضیحات
            </label>

            <textarea
                id="programNotes"
                placeholder="توضیحات کلی برنامه..."
            ></textarea>


            <!-- Training Days -->
            <div class="program-days-section">

                <div class="program-days-header">

                    <h3>جلسه‌های تمرینی</h3>

                    <button
                        type="button"
                        id="addDayButton"
                        class="small-button"
                    >
                        + افزودن جلسه
                    </button>

                </div>


                <div id="daysContainer"></div>

            </div>


            <div class="form-buttons">

                <button id="saveProgramButton">
                    ذخیره
                </button>

                <button
                    id="cancelProgramButton"
                    class="cancel-button"
                >
                    لغو
                </button>

            </div>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
